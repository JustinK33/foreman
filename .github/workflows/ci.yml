name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hook behaviour
        run: bash tests/test-after-edit.sh

      - name: Manifests are valid JSON and agree on version
        run: |
          python3 -c '
          import json
          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          entry = next(p for p in market["plugins"] if p["name"] == plugin["name"])
          assert entry.get("version") == plugin["version"], "version mismatch between manifests"
          print("ok:", plugin["name"], plugin["version"])
          '

      - name: Every skill has name and description, name matches its directory
        run: |
          python3 -c '
          import pathlib, sys
          bad = []
          for skill in sorted(pathlib.Path("skills").iterdir()):
              path = skill / "SKILL.md"
              if not path.is_file():
                  bad.append(skill.name + ": no SKILL.md")
                  continue
              lines = path.read_text().splitlines()
              if not lines or lines[0].strip() != "---":
                  bad.append(skill.name + ": no frontmatter")
                  continue
              end = lines.index("---", 1)
              fields = {}
              for line in lines[1:end]:
                  if ":" in line and not line.startswith(" "):
                      key, value = line.split(":", 1)
                      fields[key.strip()] = value.strip()
              if fields.get("name") != skill.name:
                  bad.append(skill.name + ": frontmatter name is " + repr(fields.get("name")))
              if not fields.get("description"):
                  bad.append(skill.name + ": empty description")
          if bad:
              sys.exit("\n".join(bad))
          print("ok: all skills valid")
          '

      - name: Commands are .md, and each has a matching skill
        run: |
          python3 -c '
          import pathlib, sys
          skills = {p.name for p in pathlib.Path("skills").iterdir() if p.is_dir()}
          stray = [p.name for p in pathlib.Path("commands").iterdir() if p.suffix != ".md"]
          if stray:
              sys.exit("Claude Code only loads .md commands, found: " + str(stray))
          commands = list(pathlib.Path("commands").glob("*.md"))
          orphans = [p.stem for p in commands if p.stem not in skills]
          if orphans:
              sys.exit("commands with no matching skill: " + str(orphans))
          print("ok:", len(skills), "skills,", len(commands), "commands")
          '

      - name: Docs and hooks only reference things that exist
        run: |
          python3 -c '
          import json, pathlib, re, sys
          bad = []

          # Shipping v0.1.0 left two skills saying "pair with the lean skill"
          # after lean was deleted. A dangling pointer in a prompt is a bug.
          skills = {p.name for p in pathlib.Path("skills").iterdir() if p.is_dir()}
          mention = re.compile(r"`([a-z][a-z0-9-]*)`\s+skill|skill\s+`([a-z][a-z0-9-]*)`")
          for md in pathlib.Path(".").rglob("*.md"):
              if ".git" in md.parts:
                  continue
              for match in mention.finditer(md.read_text()):
                  name = match.group(1) or match.group(2)
                  if name not in skills:
                      bad.append(f"{md}: refers to a `{name}` skill that does not exist")

          # And a hooks.json pointing at a renamed script fails silently at runtime.
          hooks = json.load(open("hooks/hooks.json"))
          for event in hooks.get("hooks", {}).values():
              for group in event:
                  for hook in group.get("hooks", []):
                      for script in re.findall(r"hooks/[\w.-]+\.sh", json.dumps(hook)):
                          if not pathlib.Path(script).is_file():
                              bad.append(f"hooks.json: {script} does not exist")
          if bad:
              sys.exit("\n".join(sorted(set(bad))))
          print("ok: no dangling references")
          '

      - name: Eval cases are structurally valid
        run: |
          python3 -c '
          import json, pathlib, re, sys
          bad = []
          patterns = []
          TYPES = {"regex", "tool_order", "tool_used", "file_exists", "llm", "baseline"}

          def frontmatter(path):
              lines = path.read_text().splitlines()
              if not lines or lines[0].strip() != "---" or "---" not in lines[1:]:
                  return None
              fields = {}
              for line in lines[1:lines.index("---", 1)]:
                  if ":" in line and not line.startswith((" ", "\t")):
                      key, value = line.split(":", 1)
                      fields[key.strip()] = value.strip().strip("\"")
              return fields

          cases = [p for p in sorted(pathlib.Path("evals").iterdir()) if p.is_dir() and p.name != "results"]
          for case in cases:
              prompt = case / "prompt.md"
              if not prompt.is_file():
                  bad.append(case.name + ": no prompt.md")
                  continue
              if frontmatter(prompt) is None:
                  bad.append(case.name + ": prompt.md has no frontmatter")
              # The eval sandbox cwd starts empty, so a fixture file sitting in the repo is
              # invisible to the agent, which then invents a shape and fails for the wrong
              # reason. Fixture code belongs inline in the prompt.
              body = prompt.read_text()
              if "fixture/" in body:
                  bad.append(case.name + ": prompt.md points into fixture/, which the sandbox cwd never contains")
              # review-severity-order once listed its seeded defects "in the order the review
              # skill is supposed to surface them" inside the fixture docstring, so the case
              # graded the agent on reading an answer key.
              leak = re.search(r"seeded|deliberate|answer key|supposed to surface|this eval|the eval asks", body, re.I)
              if leak:
                  bad.append(case.name + ": prompt.md says " + repr(leak.group(0)) + ", which tells the agent what to find")
              # A fixture for the security skill is full of plausible credentials. None of them
              # may be shaped like a live one, or a scanner treats the repo as leaking.
              secret = re.search(r"(sk_live|sk_test|sk-ant|ghp_|AKIA|xoxb)[A-Za-z0-9_-]{12,}", body)
              if secret and "EXAMPLE" not in secret.group(0):
                  bad.append(case.name + ": prompt.md contains a credential-shaped literal, mark it EXAMPLE")
              graders = sorted((case / "graders").glob("*.md"))
              if not graders:
                  bad.append(case.name + ": no graders")
              fronts = [frontmatter(g) or {} for g in graders]
              if not any(f.get("type") not in (None, "llm", "baseline") for f in fronts):
                  bad.append(case.name + ": every grader is a judge, add one that checks the outcome mechanically")
              # A not_contains grader passes against an empty response, so a case built only
              # from negations scores full marks on a run that timed out having said nothing.
              # At least one grader has to require something to be present.
              negations = [
                  f for f in fronts
                  if f.get("type") == "regex" and f.get("match", "contains") in ("not_contains", "count:0")
              ]
              if fronts and len(negations) == len(fronts):
                  bad.append(case.name + ": every grader is a negation, so an empty response scores 1.00")
              for g in graders:
                  fields = frontmatter(g)
                  if fields is None:
                      bad.append(str(g) + ": no frontmatter")
                      continue
                  kind = fields.get("type")
                  if kind not in TYPES:
                      bad.append(str(g) + ": type is " + repr(kind) + ", expected one of " + str(sorted(TYPES)))
                      continue
                  if "negate" in fields:
                      bad.append(str(g) + ": negate is not a grader key, the negation is match: not_contains")
                  if kind in ("llm", "baseline"):
                      continue
                  if not fields.get("name"):
                      bad.append(str(g) + ": a " + kind + " grader requires name:")
                  if kind != "regex":
                      continue
                  pattern = fields.get("pattern")
                  if not pattern:
                      bad.append(str(g) + ": no pattern")
                      continue
                  if re.search(r"\(\?[a-zA-Z]+[):]", pattern):
                      bad.append(str(g) + ": inline modifier in pattern; the engine is JS RegExp, which rejects them. Use flags:")
                  flags = fields.get("flags", "")
                  if not re.fullmatch(r"[dgimsuvy]*", flags):
                      bad.append(str(g) + ": flags " + repr(flags) + " are not JS RegExp flags (d g i m s u v y)")
                  match = fields.get("match", "contains")
                  if match not in ("contains", "not_contains") and not re.fullmatch(r"count:\d+", match):
                      bad.append(str(g) + ": match is " + repr(match) + ", expected contains | not_contains | count:N")
                  patterns.append({"file": str(g), "pattern": pattern, "flags": flags})

          pathlib.Path("eval-patterns.json").write_text(json.dumps(patterns))
          if bad:
              sys.exit("\n".join(bad))
          print("ok:", len(cases), "eval cases,", len(patterns), "regex graders")
          '
          node -e '
          const fs = require("fs");
          const bad = [];
          for (const g of JSON.parse(fs.readFileSync("eval-patterns.json", "utf8"))) {
            try { new RegExp(g.pattern, g.flags) } catch (e) { bad.push(g.file + ": " + e.message) }
          }
          if (bad.length) { console.error(bad.join("\n")); process.exit(1) }
          console.log("ok: every grader pattern compiles as a JS RegExp");
          '
          rm eval-patterns.json

      - name: No em dashes, no placeholders
        run: |
          # Written as `if grep` rather than `! grep`, because bash -e does not abort on a
          # command whose status is inverted with `!`, and only the last line of a run block
          # decides the step. The `!` form let an em dash through every build.
          status=0
          if grep -rn '—' --include='*.md' --include='*.json' --include='*.sh' --exclude-dir=results .; then
            echo "^ em dash found, use a plain dash"; status=1
          fi
          if grep -rn 'Your Name' --include='*.md' --include='*.json' .; then
            echo "^ placeholder author left in a manifest"; status=1
          fi
          test "$status" -eq 0 && echo "ok: no em dashes, no placeholders"
          exit "$status"

      - name: Hook scripts are executable and pass shellcheck
        run: |
          test -x hooks/after-edit.sh || { echo "hooks/after-edit.sh is not executable"; exit 1; }
          test -x tests/test-after-edit.sh || { echo "tests/test-after-edit.sh is not executable"; exit 1; }
          shellcheck hooks/after-edit.sh tests/test-after-edit.sh
